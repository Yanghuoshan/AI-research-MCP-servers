# =============================================================================
# AI Research MCP Servers — structured catalog
# -----------------------------------------------------------------------------
# This file is the SOURCE OF TRUTH for the human-readable views:
#   - CATALOG.md        (compact tables + master index)
#   - servers/*.md      (detailed entries)
#
# Rules:
#   * `id` is stable and lowercase-hyphenated. Never rename after merge.
#   * `category` must match a file stem in servers/ (e.g. `literature` ->
#     servers/literature.md).
#   * Enum values are fixed — see `enums` below. Do not invent new values
#     without also updating CONTRIBUTING.md.
#   * Changing a server means updating this file AND CATALOG.md AND
#     servers/<category>.md.
# =============================================================================

version: 1
updated: 2026-09-29

enums:
  category: [literature, models-datasets, experiments, evaluation, deployment, infrastructure]
  type: [official, community]
  difficulty: [easy, medium, advanced]
  setup: [easy, medium, advanced]
  run: [remote, local, docker]
  level: [recommended, worth-trying, experimental, advanced, use-with-care]
  permissions: [read, write, exec, billing]

categories:
  - id: literature
    title: Literature & Research
    file: servers/literature.md
    description: Papers, citations and research discovery.
  - id: models-datasets
    title: Models & Datasets
    file: servers/models-datasets.md
    description: Model hubs, dataset hubs and hosted model execution.
  - id: experiments
    title: Experiment Management
    file: servers/experiments.md
    description: Experiment tracking, run management and model registry.
  - id: evaluation
    title: Evaluation & Observability
    file: servers/evaluation.md
    description: LLM/agent evaluation, traces and observability.
  - id: deployment
    title: Inference & Deployment
    file: servers/deployment.md
    description: Inference endpoints, serving and deployment.
  - id: infrastructure
    title: Agent / Compute / DevOps
    file: servers/infrastructure.md
    description: Agent frameworks, notebooks/compute, code hosting and DevOps.

